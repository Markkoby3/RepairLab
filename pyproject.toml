[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repairlab"
version = "0.1.0"
description = "Test automation for diagnostic and repair workflows on a simulated device lab"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
repairlab = "repairlab.cli:main"

[tool.setuptools]
packages = ["repairlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
