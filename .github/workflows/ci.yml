name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 7 * * *"  # nightly chaos run
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python suite (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"

      - name: Attempt 1 (full suite)
        id: attempt1
        continue-on-error: true
        run: pytest -q --junitxml=results/attempt1.xml

      - name: Attempt 2 (rerun failures only)
        if: steps.attempt1.outcome == 'failure'
        continue-on-error: true
        run: pytest -q --lf --junitxml=results/attempt2.xml

      - name: Triage and gate
        if: always()
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          files=results/attempt1.xml
          [ -f results/attempt2.xml ] && files="$files results/attempt2.xml"
          python -m repairlab triage $files --gate --ai --md results/triage.md --json results/triage.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-py${{ matrix.python }}
          path: results/

  swift-macos:
    name: Swift DiagKit (macOS, XCTest)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift build --package-path swift/DiagKit
      - run: swift test --package-path swift/DiagKit --parallel

  swift-linux:
    name: Swift DiagKit (Linux)
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path swift/DiagKit

  chaos:
    name: Nightly chaos lab + AI triage
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Run suite against a misbehaving lab, rerun, triage
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m repairlab demo --ai --out chaos-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chaos-triage
          path: chaos-results/
